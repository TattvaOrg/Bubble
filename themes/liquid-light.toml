[colors]
base    = "#ffffff"
mantle  = "#dce8f5"
crust   = "#d0dff0"
surface = "#e8f1fa"
overlay = "#b0c8e0"
text    = "#1a2a40"
subtext = "#2a3d5a"
muted   = "#6882a0"
accent  = "#2080e0"
success = "#28a060"
warning = "#d89020"
