name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          modules: 'qtshadertools'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libgl-dev \
            libxkbcommon-dev \
            libdbus-1-dev \
            libwayland-dev \
            libegl-dev \
            libgles-dev \
            libvulkan-dev \
            wayland-protocols \
            xdg-utils \
            file \
            libfuse2 \
            libglib2.0-bin \
            libglib2.0-dev \
            libgio2.0-cil-dev \
            gvfs \
            dbus \
            p7zip-full

      - name: Build QtWayland from source
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          QT_PREFIX=$(qmake6 -query QT_INSTALL_PREFIX 2>/dev/null || qmake -query QT_INSTALL_PREFIX)
          echo "Qt prefix: $QT_PREFIX"
          git clone --depth 1 --branch v6.7.3 https://github.com/qt/qtwayland.git qtwayland-src
          cmake -S qtwayland-src -B qtwayland-src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$QT_PREFIX"
          cmake --build qtwayland-src/build --parallel
          cmake --install qtwayland-src/build

      - name: Build Rust workspace & run tests
        run: |
          cargo build --release --workspace
          cargo test --workspace

      - name: Build Bubble executable
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUBBLE_DATA_DIR=/usr/share/bubble \
            -DBUBBLE_ENABLE_QML_CACHEGEN=ON
          cmake --build build --parallel

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dbus-run-session -- ctest --test-dir build --output-on-failure --parallel 4 --timeout 300

      - name: Package precompiled binary tarball
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ./scripts/create-tarball.sh "${{ github.ref_name }}"

      - name: Upload Tarball artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: bubble-tarball
          path: Bubble-${{ github.ref_name }}-x86_64-linux.tar.gz
          if-no-files-found: error

      - name: Install into AppDir
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          DESTDIR="$GITHUB_WORKSPACE/AppDir" cmake --install build

      - name: Download linuxdeploy and Qt plugin
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          printf '%s  %s\n' \
            '421ca71d5c69ea97c6309276232990d43df1dcece0edfaa26bbf926ff96ed12e' \
            'linuxdeploy-x86_64.AppImage' | sha256sum -c -
          printf '%s  %s\n' \
            '15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724' \
            'linuxdeploy-plugin-qt-x86_64.AppImage' | sha256sum -c -
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Build AppImage
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
          EXTRA_PLATFORM_PLUGINS: libqwayland-generic.so;libqwayland-egl.so
          QML_SOURCES_PATHS: src/qml
        run: |
          set -euo pipefail
          QT_PLUGIN_DIR=$(qmake6 -query QT_INSTALL_PLUGINS 2>/dev/null || qmake -query QT_INSTALL_PLUGINS)

          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --desktop-file dist/io.github.soyeb_jim285.Bubble.desktop \
            --icon-file dist/io.github.soyeb_jim285.Bubble.svg

          deploy_deps_args=()
          for plugin_dir in \
            wayland-graphics-integration-client \
            wayland-shell-integration \
            wayland-decoration-client
          do
            if [ -d "$QT_PLUGIN_DIR/$plugin_dir" ]; then
              mkdir -p AppDir/usr/plugins
              rm -rf "AppDir/usr/plugins/$plugin_dir"
              cp -a "$QT_PLUGIN_DIR/$plugin_dir" "AppDir/usr/plugins/"
              deploy_deps_args+=(--deploy-deps-only "AppDir/usr/plugins/$plugin_dir")
            fi
          done

          scripts/prune-appdir.sh AppDir

          OUTPUT="Bubble-${TAG_NAME}-x86_64.AppImage" \
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            "${deploy_deps_args[@]}" \
            --output appimage

      - name: Verify bundled Wayland client integrations
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test -d AppDir/usr/plugins/wayland-graphics-integration-client
          test -n "$(ls -A AppDir/usr/plugins/wayland-graphics-integration-client)"

      - name: Smoke-test AppImage
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          chmod +x "Bubble-${TAG_NAME}-x86_64.AppImage"
          set +e
          QT_QPA_PLATFORM=offscreen QSG_RHI_BACKEND=software \
            timeout 10 "./Bubble-${TAG_NAME}-x86_64.AppImage" \
            > smoke.stdout 2> smoke.stderr &
          SMOKE_PID=$!
          sleep 5
          kill -TERM $SMOKE_PID 2>/dev/null || true
          wait $SMOKE_PID 2>/dev/null || true
          set -e
          if grep -E "is not a type|failed to load component|QQmlApplicationEngine failed|TypeError:|Unable to assign|Aborted \(core dumped\)|Segmentation fault|Failed to initialize graphics backend|Failed to create RHI" smoke.stderr; then
            echo "Smoke test FAILED: AppImage cannot load its QML."
            exit 1
          fi
          echo "Smoke test passed."

      - name: Upload AppImage artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: bubble-appimage
          path: Bubble-${{ github.ref_name }}-x86_64.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: bubble-appimage

      - name: Download Tarball artifact
        uses: actions/download-artifact@v4
        with:
          name: bubble-tarball

      - name: Release notes from the tag message
        run: |
          git fetch --force --no-tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > release-notes.md
          test -s release-notes.md
          head -3 release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Bubble-${{ github.ref_name }}-x86_64.AppImage
            Bubble-${{ github.ref_name }}-x86_64-linux.tar.gz
          body_path: release-notes.md
