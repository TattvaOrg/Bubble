name: Build

on:
  push:
    branches:
      - main
      - rust-rewrite
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-declarative-dev \
            libqt6svg6-dev \
            libgl-dev \
            libxkbcommon-dev \
            libdbus-1-dev \
            libwayland-dev \
            libegl-dev \
            libgles-dev \
            libvulkan-dev \
            wayland-protocols \
            xdg-utils \
            file \
            libfuse2 \
            dbus \
            e2fsprogs \
            p7zip-full
          sudo ln -sf /usr/bin/qmake6 /usr/local/bin/qmake

      - name: Cargo Build
        env:
          QMAKE: qmake6
        run: |
          cargo build --verbose --release

      - name: Cargo Test
        env:
          QMAKE: qmake6
          QT_QPA_PLATFORM: offscreen
        run: |
          dbus-run-session -- cargo test --workspace --verbose

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bubble-linux-x86_64
          path: target/release/bubble
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bubble
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
